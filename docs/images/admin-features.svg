<svg width="1280" height="760" viewBox="0 0 1280 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1280" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EFF6FF"/>
    </linearGradient>
    <style>
      .title { font: 700 36px 'Segoe UI', Arial, sans-serif; fill: #0F172A; }
      .subtitle { font: 500 18px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .card-title { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .card-text { font: 500 14px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .pill { font: 700 12px 'Segoe UI', Arial, sans-serif; fill: #0C4A6E; }
    </style>
  </defs>

  <rect width="1280" height="760" fill="url(#bg2)"/>
  <text x="70" y="86" class="title">Admin Console Features</text>
  <text x="70" y="118" class="subtitle">Monitoring, filtering, audit export, and operational controls</text>

  <rect x="70" y="160" width="1140" height="540" rx="24" fill="#FFFFFF" stroke="#CBD5E1"/>

  <rect x="108" y="202" width="240" height="108" rx="16" fill="#ECFEFF" stroke="#06B6D4"/>
  <text x="132" y="246" class="card-title">Backend Health</text>
  <text x="132" y="272" class="card-text">Live API connection state</text>

  <rect x="370" y="202" width="240" height="108" rx="16" fill="#F0FDF4" stroke="#22C55E"/>
  <text x="394" y="246" class="card-title">Schedule Metrics</text>
  <text x="394" y="272" class="card-text">Total + upcoming runs</text>

  <rect x="632" y="202" width="240" height="108" rx="16" fill="#EFF6FF" stroke="#3B82F6"/>
  <text x="656" y="246" class="card-title">Run Health</text>
  <text x="656" y="272" class="card-text">Passed / failed / avg duration</text>

  <rect x="894" y="202" width="278" height="108" rx="16" fill="#FEFCE8" stroke="#EAB308"/>
  <text x="918" y="246" class="card-title">Next Run Timer</text>
  <text x="918" y="272" class="card-text">Live minute-second countdown</text>

  <rect x="108" y="342" width="520" height="320" rx="16" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="132" y="382" class="card-title">Scheduled Runs Panel</text>
  <text x="132" y="406" class="card-text">Filter by Batch ID / Upcoming only</text>
  <text x="132" y="432" class="card-text">Shows run ID, next run timestamp, and gap</text>
  <rect x="132" y="458" width="220" height="34" rx="17" fill="#DBEAFE"/>
  <text x="178" y="480" class="pill">SEARCH + FILTER</text>

  <rect x="652" y="342" width="520" height="320" rx="16" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="676" y="382" class="card-title">Lambda Run History</text>
  <text x="676" y="406" class="card-text">Filter by status and batch ID</text>
  <text x="676" y="432" class="card-text">Drill-down: startedAt, finishedAt, duration, status</text>
  <rect x="676" y="458" width="220" height="34" rx="17" fill="#E0E7FF"/>
  <text x="712" y="480" class="pill">DETAIL VIEW</text>

  <rect x="910" y="100" width="140" height="36" rx="18" fill="#DCFCE7" stroke="#16A34A"/>
  <text x="942" y="123" class="pill">ADMIN READY</text>
</svg>
