<svg width="1280" height="760" viewBox="0 0 1280 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <style>
      .title { font: 700 36px 'Segoe UI', Arial, sans-serif; fill: #0F172A; }
      .subtitle { font: 500 18px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .section { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .line { font: 500 15px 'Consolas', 'Courier New', monospace; fill: #1E293B; }
      .hint { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="1280" height="760" fill="url(#bg)"/>
  <text x="72" y="84" class="title">API Surface - Admin Operations</text>
  <text x="72" y="116" class="subtitle">Scheduler, execution, and admin analytics endpoints</text>

  <rect x="72" y="160" width="1136" height="536" rx="24" fill="#FFFFFF" stroke="#CBD5E1"/>

  <rect x="112" y="210" width="330" height="430" rx="18" fill="#ECFEFF" stroke="#06B6D4"/>
  <text x="138" y="252" class="section">Scheduling</text>
  <text x="138" y="290" class="line">POST /api/batch/schedule</text>
  <text x="138" y="326" class="line">GET /api/batch/schedules/recent</text>
  <text x="138" y="360" class="hint">filters: limit, upcomingOnly, batchId</text>
  <text x="138" y="396" class="hint">returns: total, upcoming, recent list</text>

  <rect x="475" y="210" width="330" height="430" rx="18" fill="#EFF6FF" stroke="#3B82F6"/>
  <text x="501" y="252" class="section">Execution</text>
  <text x="501" y="290" class="line">POST /api/batch/run</text>
  <text x="501" y="326" class="line">GET /api/batch/runs</text>
  <text x="501" y="360" class="hint">filters: limit, status, batchId</text>
  <text x="501" y="396" class="hint">returns: PASSED/FAILED + timings</text>

  <rect x="838" y="210" width="330" height="430" rx="18" fill="#F0FDF4" stroke="#22C55E"/>
  <text x="864" y="252" class="section">Admin</text>
  <text x="864" y="290" class="line">GET /api/batch/admin/summary</text>
  <text x="864" y="326" class="line">GET /actuator/health</text>
  <text x="864" y="360" class="hint">returns: totals, pass/fail, avg duration</text>
  <text x="864" y="396" class="hint">used for dashboard summary cards</text>

  <rect x="1020" y="92" width="164" height="36" rx="18" fill="#DCFCE7" stroke="#22C55E"/>
  <text x="1050" y="116" class="hint">ADMIN READY API</text>
</svg>
