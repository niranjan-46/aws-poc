<svg width="1280" height="760" viewBox="0 0 1280 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#F0FDF4"/>
    </linearGradient>
    <style>
      .title { font: 700 36px 'Segoe UI', Arial, sans-serif; fill: #0F172A; }
      .subtitle { font: 500 18px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .num { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #065F46; }
      .step-title { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .step-cmd { font: 500 15px 'Consolas', 'Courier New', monospace; fill: #1E293B; }
      .hint { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="1280" height="760" fill="url(#bg)"/>
  <text x="72" y="86" class="title">Quick Start</text>
  <text x="72" y="118" class="subtitle">Run backend + frontend and verify health in under 2 minutes</text>

  <rect x="72" y="160" width="1136" height="536" rx="24" fill="#FFFFFF" stroke="#CBD5E1"/>

  <rect x="110" y="214" width="1060" height="110" rx="16" fill="#F0FDF4" stroke="#16A34A"/>
  <text x="140" y="254" class="num">1</text>
  <text x="190" y="254" class="step-title">Install Dependencies</text>
  <text x="190" y="286" class="step-cmd">npm install</text>

  <rect x="110" y="346" width="1060" height="110" rx="16" fill="#EFF6FF" stroke="#3B82F6"/>
  <text x="140" y="386" class="num">2</text>
  <text x="190" y="386" class="step-title">Start Backend</text>
  <text x="190" y="418" class="step-cmd">npm run dev:backend</text>
  <text x="620" y="418" class="hint">Health: http://localhost:8080/actuator/health</text>

  <rect x="110" y="478" width="1060" height="110" rx="16" fill="#ECFEFF" stroke="#06B6D4"/>
  <text x="140" y="518" class="num">3</text>
  <text x="190" y="518" class="step-title">Start Frontend</text>
  <text x="190" y="550" class="step-cmd">npm run dev:frontend</text>
  <text x="620" y="550" class="hint">UI: http://localhost:3000</text>

  <rect x="1000" y="96" width="180" height="36" rx="18" fill="#DCFCE7" stroke="#16A34A"/>
  <text x="1038" y="119" class="hint">READY TO RUN</text>
</svg>
