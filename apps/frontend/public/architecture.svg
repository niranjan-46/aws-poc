<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="980" viewBox="0 0 1700 980">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#ebf2fb"/>
    </linearGradient>
    <linearGradient id="regionBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfdff"/>
      <stop offset="100%" stop-color="#f3f8ff"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f2c4a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2e6ca6"/>
    </marker>
  </defs>

  <style>
    .title { font: 700 36px Arial, sans-serif; fill: #153652; }
    .subtitle { font: 600 18px Arial, sans-serif; fill: #3a5f84; }
    .laneTitle { font: 700 15px Arial, sans-serif; fill: #375f86; letter-spacing: 0.04em; text-transform: uppercase; }
    .region { fill: url(#regionBg); stroke: #7ea8ce; stroke-width: 2.4; rx: 18; }
    .lane { fill: #f7fbff; stroke: #c6d7ea; stroke-width: 1.5; rx: 14; }
    .box { fill: #ffffff; stroke: #5e85ad; stroke-width: 2; rx: 12; filter: url(#softShadow); }
    .boxTitle { font: 700 22px Arial, sans-serif; fill: #1e4064; }
    .boxText { font: 500 16px Arial, sans-serif; fill: #365b7d; }
    .arrow { stroke: #2e6ca6; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .stepCircle { fill: #2e6ca6; stroke: #ffffff; stroke-width: 2; }
    .stepText { font: 700 13px Arial, sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
    .flowText { font: 600 14px Arial, sans-serif; fill: #2f5f8f; }
    .foot { font: 600 17px Arial, sans-serif; fill: #2f5374; }
  </style>

  <rect x="0" y="0" width="1700" height="980" fill="url(#pageBg)"/>

  <text x="60" y="68" class="title">AWS Batch Scheduler POC Architecture</text>
  <text x="60" y="102" class="subtitle">Flow: Admin Request → App Runner Frontend/Backend → EventBridge Schedule → S3 Audit → Lambda Action</text>
  <text x="60" y="132" class="subtitle">Deployment Region: ap-south-1 (Mumbai)</text>

  <rect x="220" y="170" width="1440" height="730" class="region"/>

  <rect x="260" y="225" width="1360" height="175" class="lane"/>
  <text x="286" y="255" class="laneTitle">Request Layer</text>

  <rect x="260" y="430" width="1360" height="190" class="lane"/>
  <text x="286" y="460" class="laneTitle">Scheduling and Audit Layer</text>

  <rect x="260" y="650" width="1360" height="210" class="lane"/>
  <text x="286" y="680" class="laneTitle">Execution Layer</text>

  <rect x="35" y="270" width="150" height="92" class="box"/>
  <text x="73" y="324" class="boxTitle">Admin</text>

  <rect x="310" y="265" width="320" height="110" class="box"/>
  <text x="392" y="307" class="boxTitle">Frontend UI</text>
  <text x="366" y="334" class="boxText">AWS App Runner</text>

  <rect x="700" y="265" width="340" height="110" class="box"/>
  <text x="790" y="307" class="boxTitle">Backend API</text>
  <text x="766" y="334" class="boxText">AWS App Runner (Java)</text>

  <rect x="1120" y="470" width="360" height="112" class="box"/>
  <text x="1198" y="513" class="boxTitle">Amazon EventBridge</text>
  <text x="1247" y="540" class="boxText">Scheduler</text>

  <rect x="700" y="470" width="340" height="112" class="box"/>
  <text x="830" y="513" class="boxTitle">Amazon S3</text>
  <text x="752" y="540" class="boxText">Scheduled Request Audit</text>

  <rect x="1120" y="715" width="360" height="112" class="box"/>
  <text x="1252" y="758" class="boxTitle">AWS Lambda</text>
  <text x="1178" y="785" class="boxText">Batch Action Executor</text>

  <path d="M185 316 L310 316" class="arrow"/>
  <circle cx="224" cy="298" r="12" class="stepCircle"/>
  <text x="224" y="298" class="stepText">1</text>
  <text x="246" y="302" class="flowText">Admin sends request in dashboard UI</text>

  <path d="M630 316 L700 316" class="arrow"/>
  <circle cx="664" cy="298" r="12" class="stepCircle"/>
  <text x="664" y="298" class="stepText">2</text>
  <text x="686" y="302" class="flowText">Frontend calls backend endpoint</text>

  <path d="M1040 316 L1210 470" class="arrow"/>
  <circle cx="1132" cy="368" r="12" class="stepCircle"/>
  <text x="1132" y="368" class="stepText">3</text>
  <text x="1154" y="372" class="flowText">Backend creates schedule in EventBridge</text>

  <path d="M1040 332 L880 470" class="arrow"/>
  <circle cx="944" cy="388" r="12" class="stepCircle"/>
  <text x="944" y="388" class="stepText">4</text>
  <text x="966" y="392" class="flowText">Backend stores schedule audit in S3</text>

  <path d="M1300 582 L1300 715" class="arrow"/>
  <circle cx="1320" cy="648" r="12" class="stepCircle"/>
  <text x="1320" y="648" class="stepText">5</text>
  <text x="1342" y="652" class="flowText">EventBridge triggers Lambda on next run</text>

  <text x="60" y="944" class="foot">POC scope: This diagram focuses on scheduling and execution flow in AWS Mumbai.</text>
</svg>
